[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genumap"
version = "0.1.0"
description = "A reproducible study of UMAP behavior on human genetic variation data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Mohammed Khodor Firas Al-Tal" }]
dependencies = [
  "certifi>=2025.1.31",
  "matplotlib>=3.9",
  "numba>=0.61.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "typer>=0.12",
  "umap-learn>=0.5.7",
]

[project.scripts]
genumap = "genumap.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genumap"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
